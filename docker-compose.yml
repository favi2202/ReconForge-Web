services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - '127.0.0.1:8787:8787'
    environment:
      CONNECTED_MODE: ${CONNECTED_MODE:-false}
      APP_ACCESS_TOKEN: ${APP_ACCESS_TOKEN:-}
      CORS_ALLOWLIST: ${CORS_ALLOWLIST:-http://localhost:5173}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      URLSCAN_API_KEY: ${URLSCAN_API_KEY:-}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-30}
      RUN_QUERY_LIMIT: ${RUN_QUERY_LIMIT:-20}
      RUN_RESULT_LIMIT: ${RUN_RESULT_LIMIT:-100}
      PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-8000}
      BRAVE_DAILY_QUERY_LIMIT: ${BRAVE_DAILY_QUERY_LIMIT:-200}
      URLSCAN_DAILY_QUERY_LIMIT: ${URLSCAN_DAILY_QUERY_LIMIT:-100}
      SHODAN_DAILY_QUERY_LIMIT: ${SHODAN_DAILY_QUERY_LIMIT:-25}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped
