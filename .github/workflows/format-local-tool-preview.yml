name: One-shot feature formatter

on:
  push:
    branches:
      - feature/local-tool-runner-v0.3

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/local-tool-runner-v0.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write apps/api/src/local-tools.ts apps/web/src/pages/LocalToolsPage.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-local-tool-preview.yml
          git add apps/api/src/local-tools.ts apps/web/src/pages/LocalToolsPage.tsx
          git commit -m "chore: format local tool preview"
          git push origin HEAD:feature/local-tool-runner-v0.3
